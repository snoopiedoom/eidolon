# -----------------------------------------------------------------------------
# 3. Behavior schema. Generative physical vocabulary, not an animation name.
# -----------------------------------------------------------------------------

behavior_schema_example:
  schema: eidolon.behavior_schema/1
  id: gesture.contrast_present
  version: 4
  modality: gesture
  generator_kind: procedural_motor_program

  semantic_role:
    communicates: [contrast, correction, distinction]
    does_not_intrinsically_mean: [anger, surprise]

  eligibility:
    communicative_functions_any: [contrast, correct, distinguish]
    operational_states_any:
      - response.streaming
      - response.completed
    minimum_evidence_confidence: 0.55
    forbidden_if:
      - approval_requested
      - user_dragging_body

  parameters:
    side:
      type: enum
      values: [left, right, auto]
      default: auto
    extent:
      type: scalar
      range: [0.15, 1.0]
      default: 0.55
    firmness:
      type: scalar
      range: [0.0, 1.0]
      default: 0.48
    direction_bias:
      type: scalar
      range: [-1.0, 1.0]
      default: 0.0

  phase_model:
    phases:
      - prepare
      - optional_pre_nucleus_hold
      - nucleus
      - optional_post_nucleus_hold
      - connect_or_recover
      - settle
    semantic_nucleus: nucleus
    connective_phases_generated_from_current_state: true

  sync_points:
    - start
    - ready
    - nucleus_start
    - nucleus_peak
    - nucleus_end
    - relax
    - end

  default_timing_seconds:
    prepare: [0.18, 0.72]
    pre_nucleus_hold: [0.0, 0.40]
    nucleus: [0.16, 0.58]
    post_nucleus_hold: [0.0, 0.75]
    recover: [0.20, 0.90]
    settle: [0.12, 0.60]

  temporal_rules:
    - lhs: nucleus_peak
      relation: align_source_mark
      rhs: delivery.contrast-pivot
      tolerance_seconds: [-0.08, 0.12]
    - lhs: gaze.acquire
      relation: before
      rhs: nucleus_start
      bounds_seconds: [0.05, 0.42]

  resource_claim_templates:
    - resource: arm.${side}
      mode: exclusive
      phases: [prepare, nucleus, connect_or_recover]
      priority_class: semantic_gesture
    - resource: hand.${side}
      mode: exclusive
      phases: [prepare, nucleus, connect_or_recover]
      priority_class: semantic_gesture
    - resource: torso.upper
      mode: additive
      phases: [nucleus]
      maximum_weight: 0.28
    - resource: gaze
      mode: cooperative
      phases: [prepare, nucleus]
      relationship: gesture_attention

  form:
    dominant_hand:
      target_space: chest_frame
      path:
        primitive: quintic_hermite
        start: current
        nucleus_peak:
          position_normalized: [0.54, 0.12, 0.34]
          orientation:
            palm_normal: [0.20, 0.65, 0.73]
            finger_forward: [0.10, 0.03, 0.99]
      elbow_preference:
        space: shoulder_frame
        pole_direction: [0.18, -0.68, 0.71]
    torso:
      additive_rotation_degrees: [0.0, 2.5, 1.5]

  quality_mapping:
    extent: movement_quality.amplitude
    velocity: movement_quality.speed
    acceleration_shape: movement_quality.sharpness
    curvature: movement_quality.directness
    stiffness: movement_quality.tension
    lateral_asymmetry: movement_quality.asymmetry

  alternatives:
    - schema: gesture.contrast_head_only
      when:
        missing_capabilities_any: [arm_pose]
    - schema: delivery.contrast_accent
      when:
        resource_conflict_any: [arm.left, arm.right]

  interruption:
    before_nucleus: replaceable
    during_nucleus: finish_or_compress
    after_nucleus: successor_takeover
    contact_release_required: false

  validation:
    must_read_front: true
    must_read_side: true
    no_self_intersection: true
    required_capabilities: [upper_body_pose]

