    hand_frames:
      palm_normal: calibrated
      finger_forward: calibrated

  measurements:
    height_m: 1.61
    shoulder_width_m: 0.355
    hip_width_m: 0.278
    arm_span_m: 1.57
    upper_arm_length_m:
      left: 0.274
      right: 0.274
    lower_arm_length_m:
      left: 0.248
      right: 0.248

  preferred_bends:
    elbow.left: [0.18, -0.70, 0.69]
    elbow.right: [-0.18, -0.70, 0.69]
    knee.left: [0.0, 0.0, 1.0]
    knee.right: [0.0, 0.0, 1.0]

  joint_limits_file: calibration/joint-limits.yaml
  contact_surfaces_file: calibration/contact-surfaces.yaml
  expression_calibration_file: calibration/expression-targets.yaml
  hand_shapes_file: calibration/hand-shapes.yaml
  deformation_notes_file: calibration/deformation-notes.md

  expression_projection:
    affect_targets:
      happy: { valence: 0.82, arousal: 0.56, warmth: 0.72 }
      angry: { valence: -0.72, arousal: 0.78, dominance: 0.74 }
      sad: { valence: -0.78, arousal: 0.28, dominance: 0.20 }
      relaxed: { valence: 0.34, arousal: 0.16, warmth: 0.40 }
      surprised: { surprise: 0.94, arousal: 0.78 }
      focused: { certainty: 0.70, arousal: 0.38 }
    procedural_overrides:
      embarrassed:
        blink: blend
        lookAt: blend
        mouth: none

  gaze_calibration:
    eye_first_delay_seconds: [0.0, 0.04]
    head_follow_delay_seconds: [0.06, 0.18]
    torso_follow_threshold_degrees: 38.0
    eye_head_distribution: 0.58

  secondary_motion:
    ownership: vrm_spring_bone
    epr_may_inject_root_acceleration: true
    excluded_nodes_owned_by_epr: []

  fallback_mapping:
    missing_eye_bones: head_attention
    missing_expression: nearest_calibrated_affect
    missing_fingers: relaxed_hand_pose
    contact_infeasible: schema_declared_no_contact_variant
