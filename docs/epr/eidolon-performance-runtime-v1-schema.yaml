  quality_envelope:
    amplitude: 0.61
    speed: 0.68
    sharpness: 0.72
    fluidity: 0.48
    tension: 0.60
    directness: 0.83
    asymmetry: 0.32
    settle_damping: 0.56

  physical_constraints:
    - id: limit.right-arm
      kind: joint_limits
      hardness: hard
    - id: reach.right-hand
      kind: reachability
      hardness: hard
    - id: avoid.torso
      kind: self_collision_envelope
