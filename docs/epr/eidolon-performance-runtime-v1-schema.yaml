  programs:
    - channel: hand.right.position
      operator: target_trajectory
      space: chest_frame
      trajectory:
        kind: quintic_hermite
        start: current
        end: [0.54, 0.12, 0.34]
        duration_from_temporal_points: [b8841.start, b8841.nucleus_peak]
        endpoint_velocity: [0.0, 0.0, 0.0]
      weight_envelope:
        kind: smoothstep
        points:
          - [b8841.start, 0.0]
          - [b8841.ready, 1.0]
          - [b8841.nucleus_end, 1.0]
          - [b8841.end, 0.0]

    - channel: hand.right.orientation
      operator: orientation_target
      space: chest_frame
      target:
        palm_normal: [0.20, 0.65, 0.73]
        finger_forward: [0.10, 0.03, 0.99]
      interpolation: swing_twist_slerp

    - channel: elbow.right.preferred_direction
      operator: pole_target
      space: shoulder.right.frame
      direction: [0.18, -0.68, 0.71]

    - channel: torso.upper.rotation
      operator: additive_rotation
      space: anatomical_local
      degrees: [0.0, 2.5, 1.5]
      maximum_weight: 0.20

    - channel: gaze.target
      operator: cooperative_target
      target_ref: bubble.session-alpha
