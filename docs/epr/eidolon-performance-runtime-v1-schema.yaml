        - pelvis
        - torso
        - arm.left
        - arm.right
        - head
        - gaze
        - face
        - leg.left
        - leg.right
        - secondary
    torso:
      children: [torso.spine, torso.chest, shoulder.left, shoulder.right]
    arm.left:
      children: [upper_arm.left, lower_arm.left, hand.left, fingers.left]
    arm.right:
      children: [upper_arm.right, lower_arm.right, hand.right, fingers.right]
    leg.left:
      children: [upper_leg.left, lower_leg.left, foot.left, toes.left]
    leg.right:
      children: [upper_leg.right, lower_leg.right, foot.right, toes.right]
    face:
      children: [expression, mouth, blink]

  claim_modes:
    - baseline
    - exclusive
    - additive
    - masked_override
    - cooperative
    - constraint
    - observational
    - passive

resource_claims_example:
