# Eidolon Performance Runtime V1
# Illustrative architecture schema and executable-data sketch.
#
# This is not a frozen parser contract. It demonstrates how the thesis's
# boundaries can be represented in versioned, human-readable data without
# collapsing intent, planning, realization, physical solving, and VRM package
# calibration into one file.

schema: eidolon.performance_runtime.example/1
schema_version: 1

runtime:
  system: Eidolon Performance Runtime
  short_name: EPR
  deterministic_seed: 114729
  simulation:
    monotonic_clock: true
    fixed_solver_step_seconds: 0.0083333333
    max_solver_substeps: 8
    max_plan_updates_per_frame: 32
    max_behavior_units: 256
    max_temporal_points: 2048
    max_resource_claims: 1024
    max_constraints: 2048
  failure_policy:
    retain_last_valid_body_state: true
    never_delay_dialogue_indefinitely: true
    unknown_operational_state: neutral_working
    unsupported_capability: local_degradation

