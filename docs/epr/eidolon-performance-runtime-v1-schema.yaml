    asset: character.vrm
    default: true

  vrm:
    specification: VRMC_vrm-1.0
    required_extensions:
      - VRMC_vrm
    optional_extensions:
      - VRMC_springBone
      - VRMC_node_constraint
    expected_update_order:
      - humanoid
      - lookAt
      - expression_weights
      - expressions_apply
      - node_constraints
      - spring_bones

  capabilities:
    humanoid_pose: full_body
    upper_body_pose: true
    fingers: full
    gaze:
      mode: bone
      eyes_independent: false
    expressions:
      presets: [happy, angry, sad, relaxed, surprised, blink]
      custom: [embarrassed, focused, affectionate]
    visemes: [aa, ih, ou, ee, oh]
    node_constraints: [roll, aim, rotation]
    spring_bones: true
    contact_surfaces: true
