# Conversation sources. Live sources are opt-in. A passive Codex app-server connection does not
# observe another client's active thread; use the relay when Eidolon must see CLI output live.
version = 1

codex.live.enabled = false
codex.live.url = ws://127.0.0.1:4500

# In-path CLI relay. When enabled, start Eidolon first, then:
# codex --remote ws://127.0.0.1:4500
codex.relay.enabled = true
codex.relay.listen = ws://127.0.0.1:4500
codex.relay.executable = codex

opencode.live.enabled = false
opencode.live.url = http://127.0.0.1:4096/event

# Reserved adapters. Their desktop applications currently publish no supported local delta API.
chatgpt.live.enabled = false
zcode.live.enabled = false

# Completion-only compatibility paths remain independent of live providers.
legacy.codex_transcripts.enabled = true
legacy.hooks.enabled = true
